<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-type" content="text/html; charset=iso8859-1">
    <meta http-equiv="Content type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <title>Somatoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>Somatoria de numeros</h3>

    <script language="javascript">

        var js_n1;
        var js_n2; var js_soma;

        js_n1=window.prompt(' Informe um numero: ' , 'digite aqui');
        js_n2=window.prompt(' Informe outro numero: ' , 'digite aqui');

        js_soma=parseInt(js_n1) + parseInt(js_n2);

        document.write('O resultado da soma é: '+ js_soma)
    </script>
</body>
</html>
