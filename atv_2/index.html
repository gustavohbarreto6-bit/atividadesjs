<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content type" content="text.html; charset=UTF-8">
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>programa de boas vindas com concentração de campo</h3>

    <form name="FormConcatena" action=" " method="post">
        <p>digite o nome...: <input type="text" name="f_nome"></p>
        <p>digite seu sobrenome...: <input type="text" name="f_sobrenome"></p>
        <input type="button" name="btn_concatena" value="enviar" onclick="concatena()"/>
        <input type="reset" name="btn_cancela" values="cancelar">
    </form>

    <script language="javascript">
        var js_nome;
        var js_sobrenome;
        var js_nomecompleto;

        function concatena() {

            js_nome = document.FormConcatena.f_nome.values;
            js_sobrenome = document.FormConcatena.f_sobrenome.values;

            js_nomecompleto = js_nome + ' ' + js_sobrenome;

            window.alert( 'Olá ' + js_nomecompleto);
        }

    </script>
</body>
</html>
